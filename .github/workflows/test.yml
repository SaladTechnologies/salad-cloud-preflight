name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build -buildvcs=false -trimpath -o bin/salad-preflight ./cmd/salad-preflight
